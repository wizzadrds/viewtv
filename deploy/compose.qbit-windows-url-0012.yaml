# Último override del worker corregido; todo envío automático queda cerrado.
# Ejecución puntual controlada vía Python para un solo ID expresamente autorizado.
services:
  worker:
    image: viewtv:qbit-windows-url-0012
    environment:
      VIEWTV_ENABLE_TORRENT_SUBMIT: "false"
      VIEWTV_TORRENT_SUBMIT_DOWNLOAD_ID: ""
      VIEWTV_ENABLE_DOWNLOAD_START: "false"
