# Último -f del despliegue autorizado: solo imagen worker, sin enviar torrents.
# Un ID objetivo se configura únicamente para una prueba real autorizada.
services:
  worker:
    image: viewtv:ensayo-torrent-unico-0012
    environment:
      VIEWTV_ENABLE_TORRENT_SUBMIT: "false"
      VIEWTV_TORRENT_SUBMIT_DOWNLOAD_ID: ""
      VIEWTV_ENABLE_DOWNLOAD_START: "false"
