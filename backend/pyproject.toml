[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viewtv-backend"
version = "0.1.0"
description = "API de VIEWTV"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlmodel>=0.0.22,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.10,<3.0",
  "slowapi>=0.1.9,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
