# Superponer después de compose.yaml y compose.production.yaml.
# Ejemplo:
# docker compose -f compose.yaml -f compose.production.yaml \
#   -f ~/viewtv-backups/compose-verification-enabled.yaml \
#   -f compose.release-0012.yaml up -d --no-build
services:
  api:
    image: viewtv:predeploy-0012-release

  worker:
    image: viewtv:predeploy-0012-release
    environment:
      VIEWTV_ENABLE_DOWNLOAD_VERIFICATION: "true"
      VIEWTV_ENABLE_DOWNLOAD_START: "false"

  frontend:
    image: viewtv-frontend:predeploy-0012
    environment:
      VIEWTV_API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
